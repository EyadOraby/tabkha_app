name: tabkha_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.6.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  provider: ^6.0.4
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  flash: ^3.1.1
  flutter_phoenix: ^1.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  riverpod_annotation: ^2.6.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.5.1
  smooth_page_indicator: ^1.2.1




dev_dependencies:
  flutter_test:
    sdk: flutter

  riverpod_generator: ^2.6.3

  build_runner: ^2.4.15
  hive_generator: ^2.0.1
  flutter_lints: ^5.0.0


flutter:

  generate: true

  uses-material-design: true

  assets:
    - assets/images/



  fonts:
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf
    - family: Montserrat
      fonts:        
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf

