name: tabkha_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.6.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  provider: ^6.0.4
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  flash: ^3.1.1
  flutter_phoenix: ^1.1.1
  riverpod_annotation: ^4.0.8
  flutter_riverpod: ^3.5.0
  smooth_page_indicator: ^1.2.1
  hive_ce: ^2.24.0
  hive_ce_flutter: 2.3.3
  http: ^1.6.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_ce_generator: ^1.12.1
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1


flutter:

  generate: true

  uses-material-design: true

  assets:
    - assets/food_seed.json
    - assets/images/



  # Brand type, all SIL Open Font License (see assets/fonts/brand/OFL-*.txt).
  fonts:
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/brand/YoungSerif.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/brand/Nunito.ttf
    - family: Lalezar
      fonts:
        - asset: assets/fonts/brand/Lalezar.ttf
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/brand/BalooBhaijaan2.ttf

